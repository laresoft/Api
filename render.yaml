# Blueprint para desplegar "Cuentas" en Render
# La documentación completa está en README.md

services:
  - type: web
    name: cuentas
    runtime: node
    # El plan Free NO permite discos persistentes y borraría la base de datos
    # al reiniciar. Por eso usamos el plan Starter (de pago).
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # La base de datos se guarda en el disco persistente montado abajo
      - key: DB_PATH
        value: /var/data/gastos.db
    disk:
      name: cuentas-datos
      mountPath: /var/data
      sizeGB: 1
