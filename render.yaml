# Blueprint para desplegar "Cuentas" en Render (plan gratis)
# La base de datos es PostgreSQL gratis de Supabase (no hace falta disco).

services:
  - type: web
    name: cuentas
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render te va a pedir el valor al crear el servicio (sync: false).
      # Pegá la misma DATABASE_URL que usás en tu .env local.
      - key: DATABASE_URL
        sync: false
      # Clave para firmar los tokens de sesión (generada con openssl rand -hex 32).
      # La cargamos en el Environment del servicio; sync: false evita subirla al repo.
      - key: JWT_SECRET
        sync: false
      # Envío de correos para recuperar contraseñas (Gmail con contraseña de aplicación)
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      # Render Free bloquea SMTP: en producción se envía por HTTPS con Brevo
      - key: BREVO_API_KEY
        sync: false
