name: Compilar APK de Cuentas

# La APK solo muestra la URL de Render: no hace falta recompilarla por cambios web.
# Se compila cuando cambia algo nativo o manualmente desde Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'scripts/parchear-android.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar proyecto Android
        run: node node_modules/@capacitor/cli/bin/capacitor add android

      - name: Habilitar WebAuthn en el WebView
        run: node scripts/parchear-android.js

      - name: Copiar archivos web
        run: |
          mkdir -p www
          cp index.html style.css script.js sw.js manifest.webmanifest \
             icon-192.png icon-512.png icon-512-maskable.png www/

      - name: Sincronizar Capacitor
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Importar keystore de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cuentas.p12"
          chmod 600 "$RUNNER_TEMP/cuentas.p12"

      - name: Compilar APK firmada
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/cuentas.p12" \
            -Pandroid.injected.signing.store.type=pkcs12 \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: cuentas-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
